<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bài giữa kỳ cô Vân Anh – Panoee + MC</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }

  #tour-embedded {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    z-index: 1;
  }

  /* MC stays fixed to the browser screen, not to the 360 panorama */
  #mcCanvas {
    position: fixed;
    right: 2.5vw;
    bottom: 0;
    width: min(24vw, 300px);
    height: auto;
    z-index: 20;
    pointer-events: none;
    display: block;
  }

  #mcVideo {
    display: none;
  }

  @media (max-width: 700px) {
    #mcCanvas {
      width: 38vw;
      right: 2vw;
    }
  }
</style>
</head>

<body>
<iframe
  id="tour-embedded"
  title="Bài giữa kỳ cô Vân Anh"
  src="https://tour.panoee.net/iframe/6aa3ef7647005cbdbc76e7fe?embedFullscreen=1&amp;embedVr=1&amp;embedGyro=1"
  frameborder="0"
  scrolling="no"
  allow="autoplay; accelerometer; gyroscope; fullscreen; xr-spatial-tracking"
  loading="eager"
  allowfullscreen>
</iframe>

<video id="mcVideo" src="mc.mp4" autoplay muted loop playsinline preload="auto"></video>
<canvas id="mcCanvas"></canvas>

<script>
/* Preserve Panoee's gyro forwarding behavior from its embed code. */
(function(){
  var i="tour-embedded", o="https://tour.panoee.net", r=false;
  function s(v,a){
    if(!v)return null;
    var x={};
    a.forEach(function(k){x[k]=typeof v[k]==="number"?v[k]:null});
    return x;
  }
  function ready(f){
    try{
      var h=f.contentWindow.location.href;
      if(h && h!=="about:blank") r=true;
    }catch(e){ r=true; }
  }
  function send(payload){
    var el=document.getElementById(i);
    if(!el || !el.contentWindow)return;
    try{ el.contentWindow.postMessage(payload,o); }catch(t){}
  }
  var f=document.getElementById(i);
  if(f){
    f.addEventListener("load",function(){r=true});
    ready(f);
  }
  window.addEventListener("message",function(ev){
    if(!r || !ev.data || ev.data.type!=="devicemotion")return;
    if(ev.source!==window.parent)return;
    send(ev.data);
  },false);
  window.addEventListener("devicemotion",function(e){
    if(!r)return;
    send({
      type:"devicemotion",
      deviceMotionEvent:{
        acceleration:s(e.acceleration,["x","y","z"]),
        accelerationIncludingGravity:s(e.accelerationIncludingGravity,["x","y","z"]),
        rotationRate:s(e.rotationRate,["alpha","beta","gamma"]),
        interval:typeof e.interval==="number"?e.interval:0,
        timeStamp:e.timeStamp
      }
    });
  },{passive:true});
})();

/* Green-screen removal.
   The video itself is hidden; only the keyed canvas is shown.
   The canvas is position:fixed, so it does NOT rotate with the iframe. */
(function(){
  const video = document.getElementById("mcVideo");
  const canvas = document.getElementById("mcCanvas");
  const ctx = canvas.getContext("2d", {willReadFrequently:true});

  const SOURCE_W = 1080;
  const SOURCE_H = 1920;
  const ASPECT = SOURCE_W / SOURCE_H;

  function resizeCanvas(){
    const cssWidth = Math.min(window.innerWidth * 0.24, 300);
    const cssHeight = cssWidth / ASPECT;
    canvas.width = Math.round(cssWidth * devicePixelRatio);
    canvas.height = Math.round(cssHeight * devicePixelRatio);
    canvas.style.width = cssWidth + "px";
    canvas.style.height = cssHeight + "px";
  }

  function keyFrame(){
    if (video.readyState < 2) {
      requestAnimationFrame(keyFrame);
      return;
    }

    if (canvas.width === 0 || canvas.height === 0) resizeCanvas();

    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const image = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = image.data;

    /*
      Green key tuned as a starting point for the Panoee green-screen
      color (#238E54). Increase DISTANCE for more aggressive removal.
    */
    const keyR = 35, keyG = 142, keyB = 84;
    const DISTANCE = 72;
    const SOFTNESS = 28;

    for(let p=0; p<data.length; p+=4){
      const r=data[p], g=data[p+1], b=data[p+2];

      const dist = Math.sqrt(
        (r-keyR)*(r-keyR) +
        (g-keyG)*(g-keyG) +
        (b-keyB)*(b-keyB)
      );

      /* Green dominance prevents dark/neutral clothing from disappearing. */
      const greenDominance = g - Math.max(r,b);

      if (dist < DISTANCE && greenDominance > 8) {
        data[p+3] = 0;
      } else if (dist < DISTANCE + SOFTNESS && greenDominance > 3) {
        const alpha = Math.round(
          255 * (dist - DISTANCE) / SOFTNESS
        );
        data[p+3] = Math.min(data[p+3], alpha);
      }
    }

    ctx.putImageData(image, 0, 0);
    requestAnimationFrame(keyFrame);
  }

  video.addEventListener("loadedmetadata", resizeCanvas);
  window.addEventListener("resize", resizeCanvas);

  video.play().catch(()=>{});
  resizeCanvas();
  requestAnimationFrame(keyFrame);
})();
</script>
</body>
</html>
